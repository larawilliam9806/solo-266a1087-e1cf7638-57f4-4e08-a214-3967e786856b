<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>示例目录源 · 故障控制台</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  main { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 22px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #7dd3fc; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, select { font: inherit; border-radius: 8px; border: 1px solid #475569; padding: 8px 14px; background: #334155; color: #f1f5f9; cursor: pointer; }
  button:hover { background: #475569; }
  button.danger { background: #7f1d1d; border-color: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  button.warn { background: #78350f; border-color: #b45309; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  pre { background: #0f172a; border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; max-height: 320px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv b { color: #94a3b8; font-weight: 500; }
  #msg { min-height: 20px; font-size: 13px; margin-top: 8px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  a { color: #7dd3fc; }
</style>
</head>
<body>
<main>
  <h1>🏛 示例藏品目录源 · 故障控制台</h1>
  <div class="sub">
    采集端目录接口：<code id="catalogUrl">/catalog</code> ·
    <a href="/docs">OpenAPI 文档</a> ·
    <a href="/admin/state">当前状态 JSON</a>
  </div>

  <div class="card">
    <h2>① 切换目录版本（旧快照令牌立即失效）</h2>
    <div class="row">
      <select id="version"></select>
      <button class="warn" onclick="switchVersion()">切换版本</button>
    </div>
  </div>

  <div class="card">
    <h2>② 令单页失败一次（下次请求该页返回 500，仅一次）</h2>
    <div class="row">
      <select id="failVersion"></select>
      <select id="failPage">
        <option value="1">第 1 页</option>
        <option value="2">第 2 页</option>
        <option value="3">第 3 页</option>
      </select>
      <button onclick="armFail()">装填一次性故障</button>
    </div>
  </div>

  <div class="card">
    <h2>③ 令当前快照令牌失效（再翻页返回 410 Gone）</h2>
    <div class="row">
      <button class="danger" onclick="invalidate()">令令牌失效</button>
    </div>
  </div>

  <div class="card">
    <h2>源当前状态（每 3 秒刷新）</h2>
    <div class="kv" id="stateKv"></div>
    <pre id="stateJson"></pre>
    <div id="msg"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || data.error || ("HTTP " + r.status));
  return data;
}
function flash(text, ok) {
  const el = $("msg");
  el.textContent = text; el.className = ok ? "ok" : "err";
  setTimeout(() => { el.textContent = ""; }, 4000);
}
async function switchVersion() {
  try { const d = await api("/admin/switch-version?version=" + encodeURIComponent($("version").value), {method: "POST"});
    flash("已切换到 " + d.version + "，新令牌 " + d.token, true); await refresh(); }
  catch (e) { flash("失败：" + e.message, false); }
}
async function armFail() {
  try { await api(`/admin/fail-page-once?version=${encodeURIComponent($("failVersion").value)}&page=${$("failPage").value}`, {method: "POST"});
    flash("一次性故障已装填", true); await refresh(); }
  catch (e) { flash("失败：" + e.message, false); }
}
async function invalidate() {
  try { await api("/admin/invalidate-token", {method: "POST"});
    flash("当前令牌已失效，采集端需新建批次", true); await refresh(); }
  catch (e) { flash("失败：" + e.message, false); }
}
async function refresh() {
  const s = await api("/admin/state");
  $("version").innerHTML = s.versions.map(v => `<option ${v === s.version ? "selected" : ""}>${v}</option>`).join("");
  $("failVersion").innerHTML = s.versions.map(v => `<option ${v === s.version ? "selected" : ""}>${v}</option>`).join("");
  $("stateKv").innerHTML = `
    <b>当前版本</b><div><code>${s.version}</code></div>
    <b>当前令牌</b><div><code>${s.current_token || "（空，请求首页后签发）"}</code></div>
    <b>存活令牌</b><div>${s.live_tokens.map(t => `<code>${t}</code>`).join(" ") || "无"}<br>
      <span style="color:#64748b;font-size:11px">同版本多令牌对应并行批次，均有效</span></div>
    <b>总页数</b><div>${s.total_pages}</div>
    <b>待触发故障</b><div>${s.fail_once.length ? JSON.stringify(s.fail_once) : "无"}</div>
    <b>已失效令牌</b><div>${s.dead_tokens.map(t => `<code>${t}</code>`).join(" ") || "无"}</div>`;
  $("stateJson").textContent = JSON.stringify(s, null, 2);
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
